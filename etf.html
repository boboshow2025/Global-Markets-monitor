<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#091426" />
<title>主動ETF選股名單 · Global Markets Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#2F4245; --panel:#283A3D; --panel2:#243538; --line:#476064; --text:#F2EFEA; --muted:#C6D0CF;
    --gold:#F0D9C6; --up:#D58079; --down:#8DB5A0; --warn:#CDAE72;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --disp:"Space Grotesk","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    --sans:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--text);font-family:var(--sans)}
  body{min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) clamp(14px,3vw,34px) calc(28px + env(safe-area-inset-bottom));max-width:1180px;margin:0 auto}
  a{color:var(--gold)}
  .top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line);position:relative}
  .top::after{content:"";position:absolute;left:0;bottom:-1px;width:120px;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}
  h1{font-family:var(--disp);font-size:clamp(20px,2.6vw,28px);font-weight:700;letter-spacing:.02em}
  .sub{margin-top:6px;color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.08em}
  .links{display:flex;gap:8px;flex-wrap:wrap}
  .btn{display:inline-block;padding:7px 12px;border:1px solid var(--gold);border-radius:8px;color:var(--gold);font-size:13px;text-decoration:none}
  .btn:hover{background:rgba(240,217,198,.12)}
  .btn.ghost{border-color:var(--line);color:var(--muted)}

  .ctx{margin:16px 0;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:12px;padding:14px 16px}
  .ctx.go{border-left-color:var(--up)} .ctx.def{border-left-color:var(--down)}
  .ctx .tag{font-family:var(--disp);font-weight:700;font-size:20px;white-space:nowrap}
  .ctx.go .tag{color:var(--up)} .ctx.def .tag{color:var(--down)}
  .ctx .txt{font-size:14px;line-height:1.6;color:var(--text)}
  .ctx .txt small{display:block;color:var(--muted);font-size:12px}


  .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .tab{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer;font-family:var(--sans)}
  .tab.on{border-color:var(--gold);color:var(--gold);background:rgba(201,169,106,.08)}
  .tab em{font-style:normal;font-size:11px;margin-left:4px;color:var(--up)}
  .desc{font-size:13px;color:var(--muted);margin:2px 0 10px;line-height:1.6}
  .chg{font-size:13px;margin:-4px 0 10px;line-height:1.7}
  .chg .in{color:var(--up)} .chg .out{color:var(--muted);text-decoration:line-through}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
  th{font-size:12px;font-weight:500;color:var(--muted);background:var(--panel2);position:sticky;top:0}
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
  tr:last-child td{border-bottom:none}
  td.num{font-family:var(--mono)}
  td .code{font-family:var(--mono);color:var(--muted);font-size:12px;margin-left:6px}
  .new{display:inline-block;font-size:10px;color:var(--ink);background:var(--up);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
  .pos{color:var(--up)} .neg{color:var(--down)} .mut{color:var(--muted)}
  .bar{display:inline-block;height:6px;border-radius:3px;background:var(--gold);vertical-align:middle;margin-right:6px;opacity:.8}
  .trend{font-size:12px;padding:1px 6px;border-radius:4px;border:1px solid var(--line)}
  .trend.ok{color:var(--up);border-color:rgba(229,83,75,.4)} .trend.mid{color:var(--warn);border-color:rgba(227,163,59,.4)} .trend.bad{color:var(--down);border-color:rgba(63,182,139,.4)}

  .note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:14px}
  .empty{padding:40px 16px;text-align:center;color:var(--muted)}
  @media (max-width:640px){ .ctx{grid-template-columns:1fr} th,td{padding:8px 7px;font-size:13px} .hide-s{display:none} }
  /* ===== 深色莫蘭迪金融主題 v1.0 ＋ 語意配色（與首頁一致） ===== */
  :root{
    --bg-main:#091426; --bg-section:#1E2730; --bg-card:#151C23; --bg-card-hover:#1B2430;
    --border-section:#36434F; --border-card:#2E3A45; --border-subtle:#2A3540;
    --text-primary:#F0F1ED; --text-secondary:#C1CBCB; --text-muted:#A3AFB3;
    --risk-3:#D9665E; --risk-2:#D08A82; --risk-1:#DDB3AD; --sig-neutral:#8FA8BD; --sig-favor:#8FB7A5;
    --num-up:#FF4D4F; --num-down:#2EE68A; --chart-1:#D99A6C; --sand:#C9B8A6;
    --ink:var(--bg-main); --panel:var(--bg-card); --panel2:var(--bg-section); --line:var(--border-card);
    --text:var(--text-primary); --muted:var(--text-muted); --gold:var(--sand); --up:var(--num-up); --down:var(--num-down); --warn:var(--risk-1);
  }
  body{font-variant-numeric:tabular-nums}
  .btn:hover{background:var(--bg-card-hover)}
  .ctx{background:var(--bg-section);border-color:var(--border-section);border-left-color:var(--sig-neutral)}
  .ctx.go{border-left-color:var(--sig-favor)} .ctx.go .tag{color:var(--sig-favor)}
  .ctx.def{border-left-color:var(--risk-2)} .ctx.def .tag{color:var(--risk-2)}
  .card{background:var(--bg-card);border-color:var(--border-section)}
  .ctx,.card{box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px -12px rgba(0,0,0,.6)}
  th{background:var(--bg-section)}
  .tab{background:var(--bg-section);border-color:var(--border-card)}
  .tab.on{border-color:var(--sand);color:var(--text-primary);background:var(--bg-card-hover)}
  .tab em{color:var(--sig-favor)}
  .chg .in{color:var(--sig-favor)}
  .new{color:var(--bg-main);background:var(--sig-favor)}
  .pos{color:var(--num-up);font-weight:600} .neg{color:var(--num-down);font-weight:600}
  .bar{background:var(--chart-1)}
  .trend.ok{color:var(--sig-favor);border-color:color-mix(in srgb,var(--sig-favor) 50%,transparent)}
  .trend.mid{color:var(--risk-1);border-color:color-mix(in srgb,var(--risk-1) 50%,transparent)}
  .trend.bad{color:var(--risk-2);border-color:color-mix(in srgb,var(--risk-2) 50%,transparent)}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>主動ETF選股名單</h1>
    <div class="sub" id="sub">載入中…</div>
  </div>
  <nav class="links">
    <a class="btn" href="./index.html">← 回盤勢監控</a>
  </nav>
</header>

<section class="ctx" id="ctx"><div class="tag">—</div><div class="txt">讀取資金輪動狀態…</div></section>

<div class="tabs" id="tabs"></div>
<div class="desc" id="desc"></div>
<div class="chg" id="chg"></div>
<div class="card"><div class="scroll"><table id="picks"></table></div></div>


<p class="note">
  名單來源：portfolio_backtest.py，依所有主動ETF最新一天的持股合成。<b>高超配</b>＝主動經理人合計權重比 0050 多最多的股票（主動ETF真正押注的地方）；<b>共識持股</b>＝最多檔主動ETF同時持有；<b>合成權重</b>＝把所有主動ETF當成一檔基金的前十大。<br>
  均線欄位：收盤價相對 20 日／60 日均線的距離，兩條都在上方＝趨勢仍在。<br>
  使用方式：資金輪動在「進攻」時依名單布局；轉「防守」時名單只做觀察，等轉回進攻再進場。僅供參考，非投資建議。
</p>

<script>
const STRAT_DESC = {
  "高超配": "主動經理人比大盤多押的股票 —— 建議當主要進攻池。",
  "共識持股": "被最多檔主動ETF同時持有的股票，偏大型、穩定。",
  "合成權重": "把所有主動ETF合成一檔後的前十大持股（含台積電等大權值）。"
};
const ORDER = ["高超配", "共識持股", "合成權重"];
const fmt = (v, d = 2, sign = false) => v == null || isNaN(v) ? "—" : (sign && v > 0 ? "+" : "") + Number(v).toFixed(d);
const cls = v => v == null ? "mut" : v > 0 ? "pos" : v < 0 ? "neg" : "mut";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const short = c => String(c).replace(/\.TWO?$/, "");

async function getJSON(u) {
  try { const r = await fetch(u + "?t=" + Date.now()); return r.ok ? await r.json() : null; } catch (e) { return null; }
}

function trend(r) {
  if (r.vs_ma20 == null || r.vs_ma60 == null) return '<span class="mut">—</span>';
  if (r.vs_ma20 >= 0 && r.vs_ma60 >= 0) return '<span class="trend ok">多頭</span>';
  if (r.vs_ma60 >= 0) return '<span class="trend mid">回檔</span>';
  return '<span class="trend bad">轉弱</span>';
}

function renderCtx(rot, panic, picks) {
  const el = document.getElementById("ctx");
  if (!rot) { el.innerHTML = '<div class="tag">—</div><div class="txt">還沒有資金輪動資料（rotation.json）。</div>'; return; }
  const go = rot.state === "進攻";
  el.className = "ctx " + (go ? "go" : "def");
  let msg = go
    ? `主動ETF相對 0050 站上 MA${rot.ma}，資金偏積極。<b>可依「高超配」名單布局</b>，優先挑均線仍是多頭的。`
    : `主動ETF相對 0050 跌破 MA${rot.ma}，資金偏保守。<b>名單先觀察、不急著進場</b>${rot.days_to_offense ? `；連續站上 ${rot.confirm_up} 天才轉攻（還差 ${rot.days_to_offense} 天）` : ""}。`;
  let extra = `資金輪動 ${rot.date}：${esc(rot.label || rot.state)}，已 ${rot.days_in_state} 天`;
  if (panic && panic.state_text) extra += `｜恐慌儀表 ${panic.date}：${esc(panic.state_text)}`;
  if (picks && rot.date && picks.date && rot.date !== picks.date) extra += `｜注意：名單日期 ${picks.date} 與輪動日期不同`;
  el.innerHTML = `<div class="tag">${go ? "▲ 進攻" : "▼ 防守"}</div><div class="txt">${msg}<small>${extra}</small></div>`;
}

let DATA = null, CUR = "高超配";
function renderTabs() {
  document.getElementById("tabs").innerHTML = ORDER.filter(s => DATA.picks[s]).map(s => {
    const n = ((DATA.changes || {})[s] || {}).in || [];
    return `<button class="tab${s === CUR ? " on" : ""}" data-s="${s}">${s}${n.length ? `<em>+${n.length}</em>` : ""}</button>`;
  }).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { CUR = b.dataset.s; renderTabs(); renderPicks(); });
}

function renderPicks() {
  const rows = DATA.picks[CUR] || [];
  const ch = (DATA.changes || {})[CUR];
  const names = DATA.names || {};
  document.getElementById("desc").textContent = STRAT_DESC[CUR] || "";
  const chEl = document.getElementById("chg");
  if (ch && DATA.prev_date && (ch.in.length || ch.out.length)) {
    chEl.innerHTML = `與 ${DATA.prev_date} 相比：` +
      (ch.in.length ? ch.in.map(c => `<span class="in">＋${esc(names[c] || short(c))}</span>`).join("、") : "") +
      (ch.in.length && ch.out.length ? "　" : "") +
      (ch.out.length ? ch.out.map(c => `<span class="out">${esc(names[c] || short(c))}</span>`).join("、") : "");
  } else if (ch && DATA.prev_date) {
    chEl.innerHTML = `<span class="mut">與 ${DATA.prev_date} 相比名單沒有變動</span>`;
  } else chEl.innerHTML = "";
  const newSet = new Set(ch ? ch.in : []);
  const maxW = Math.max(...rows.map(r => Math.abs(CUR === "高超配" ? r.over : r.agg_w) || 0), 0.001);
  const head = `<tr><th>#</th><th>股票</th><th>持有檔數</th><th>合成權重%</th><th class="hide-s">0050權重%</th><th>超配度%</th>
    <th>近5日%</th><th class="hide-s">收盤</th><th>距MA20%</th><th>距MA60%</th><th>趨勢</th></tr>`;
  const body = rows.map((r, i) => {
    const key = CUR === "高超配" ? r.over : r.agg_w;
    const w = Math.max(4, Math.round(Math.abs(key || 0) / maxW * 46));
    return `<tr>
      <td class="mut">${i + 1}</td>
      <td>${esc(r.name)}<span class="code">${short(r.code)}${r.market === "上櫃" ? " 櫃" : ""}</span>${newSet.has(r.code) ? '<span class="new">新</span>' : ""}</td>
      <td class="num">${r.holders} / ${DATA.n_etf}</td>
      <td class="num">${CUR !== "高超配" ? `<span class="bar" style="width:${w}px"></span>` : ""}${fmt(r.agg_w, 2)}</td>
      <td class="num hide-s mut">${fmt(r.bm_w, 2)}</td>
      <td class="num ${cls(r.over)}">${CUR === "高超配" ? `<span class="bar" style="width:${w}px"></span>` : ""}${fmt(r.over, 2, true)}</td>
      <td class="num ${cls(r.ret5)}">${fmt(r.ret5, 2, true)}</td>
      <td class="num hide-s">${fmt(r.close, r.close >= 100 ? 1 : 2)}</td>
      <td class="num ${cls(r.vs_ma20)}">${fmt(r.vs_ma20, 1, true)}</td>
      <td class="num ${cls(r.vs_ma60)}">${fmt(r.vs_ma60, 1, true)}</td>
      <td>${trend(r)}</td></tr>`;
  }).join("");
  document.getElementById("picks").innerHTML = head + (body || `<tr><td colspan="11" class="empty">沒有資料</td></tr>`);
}

(async () => {
  const [picks, rot, panic] = await Promise.all([getJSON("data/etf_picks.json"), getJSON("data/rotation.json"), getJSON("data/panic.json")]);
  renderCtx(rot, panic, picks);
  if (!picks) {
    document.getElementById("sub").textContent = "尚無選股資料";
    document.getElementById("picks").innerHTML = `<tr><td class="empty">還沒有 etf_picks.json —— 晚上 ETF 排程跑完 portfolio_backtest.py 後會自動推上來。</td></tr>`;
    return;
  }
  DATA = picks;
  document.getElementById("sub").textContent = `持股日 ${picks.date} · ${picks.n_etf} 檔主動ETF合成 · 更新 ${picks.generated_at.replace("T", " ")}`;
  renderTabs(); renderPicks();
})();
</script>
</body>
</html>

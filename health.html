<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#091426" />
<title>持股健檢 · Global Markets Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg-main:#091426; --bg-section:#1E2730; --bg-card:#151C23; --bg-card-hover:#1B2430;
    --border-section:#36434F; --border-card:#2E3A45;
    --text:#F0F1ED; --text2:#C1CBCB; --muted:#A3AFB3;
    --risk-3:#D9665E; --risk-2:#D08A82; --risk-1:#DDB3AD; --neutral:#8FA8BD; --favor:#8FB7A5;
    --up:#FF4D4F; --down:#2EE68A; --sand:#C9B8A6;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --disp:"Space Grotesk","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    --sans:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg-main);color:var(--text);font-family:var(--sans)}
  body{min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) clamp(14px,3vw,34px) calc(28px + env(safe-area-inset-bottom));max-width:1180px;margin:0 auto;font-variant-numeric:tabular-nums}
  a{color:var(--sand)}
  .top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--border-card);position:relative}
  .top::after{content:"";position:absolute;left:0;bottom:-1px;width:120px;height:2px;background:linear-gradient(90deg,var(--sand),transparent)}
  h1{font-family:var(--disp);font-size:clamp(20px,2.6vw,28px);font-weight:700;letter-spacing:.02em}
  h2{font-family:var(--disp);font-size:17px;font-weight:600;margin:26px 0 10px}
  .sub{margin-top:6px;color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.08em}
  .links{display:flex;gap:8px;flex-wrap:wrap}
  .btn{display:inline-block;padding:7px 12px;border:1px solid var(--sand);border-radius:8px;color:var(--sand);font-size:13px;text-decoration:none;background:none;cursor:pointer;font-family:var(--sans)}
  .btn:hover{background:var(--bg-card-hover)}
  .btn.solid{background:var(--sand);color:var(--bg-main);font-weight:600}
  .legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:16px 0}
  .lg{background:var(--bg-section);border:1px solid var(--border-section);border-left:4px solid var(--muted);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5}
  .lg b{display:block;font-size:14px;margin-bottom:2px}
  .lg small{color:var(--muted)}
  .s-過熱{border-left-color:var(--risk-3)} .s-轉弱{border-left-color:var(--risk-2)} .s-跌深{border-left-color:var(--neutral)}
  .s-回檔{border-left-color:var(--favor)} .s-正常{border-left-color:var(--muted)}
  .input{background:var(--bg-section);border:1px solid var(--border-section);border-radius:12px;padding:14px;display:grid;gap:10px}
  textarea{width:100%;min-height:64px;background:var(--bg-card);color:var(--text);border:1px solid var(--border-card);border-radius:8px;padding:10px;font-family:var(--mono);font-size:14px;resize:vertical}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .hint{font-size:12px;color:var(--muted)}
  .card{background:var(--bg-card);border:1px solid var(--border-section);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px -12px rgba(0,0,0,.6)}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border-card);vertical-align:top}
  th{font-size:12px;font-weight:500;color:var(--muted);background:var(--bg-section);position:sticky;top:0}
  th.l,td.l{text-align:left}
  td.why{white-space:normal;min-width:220px;max-width:360px;text-align:left;font-size:12.5px;color:var(--text2);line-height:1.55}
  tr:last-child td{border-bottom:none}
  td.num{font-family:var(--mono)}
  .code{font-family:var(--mono);color:var(--muted);font-size:12px;margin-left:6px}
  .pos{color:var(--up);font-weight:600} .neg{color:var(--down);font-weight:600} .mut{color:var(--muted)}
  .badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid;font-weight:600}
  .b-過熱{color:var(--risk-3);border-color:var(--risk-3)} .b-轉弱{color:var(--risk-2);border-color:var(--risk-2)}
  .b-跌深{color:var(--neutral);border-color:var(--neutral)} .b-回檔{color:var(--favor);border-color:var(--favor)}
  .b-正常{color:var(--muted);border-color:var(--border-section)}
  .act{display:block;font-size:12px;color:var(--text2);margin-top:3px}
  .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .tab{background:var(--bg-section);border:1px solid var(--border-card);color:var(--muted);border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer;font-family:var(--sans)}
  .tab.on{border-color:var(--sand);color:var(--text);background:var(--bg-card-hover)}
  .tab em{font-style:normal;font-size:11px;margin-left:4px;color:var(--muted)}
  .empty{padding:32px 16px;text-align:center;color:var(--muted)}
  .missing{font-size:13px;color:var(--risk-1);margin-top:8px}
  .note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:14px}
  @media (max-width:640px){ th,td{padding:8px 7px;font-size:13px} .hide-s{display:none} td.why{min-width:180px} }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>持股健檢</h1>
    <div class="sub" id="sub">載入中…</div>
  </div>
  <nav class="links">
    <a class="btn" href="./etf.html">主動ETF選股</a>
    <a class="btn" href="./index.html">← 回盤勢監控</a>
  </nav>
</header>

<section class="legend" id="legend"></section>

<section class="input">
  <label for="codes" class="hint">輸入你的持股代碼（空白、逗號或換行分隔，例如：<span style="font-family:var(--mono)">2330 3037 6669</span>）。只存在你自己的瀏覽器，不會上傳。</label>
  <textarea id="codes" placeholder="2330 3037 6669"></textarea>
  <div class="row">
    <button class="btn solid" id="go">檢查</button>
    <button class="btn" id="clear">清除</button>
    <span class="hint" id="saved"></span>
  </div>
  <div class="missing" id="missing"></div>
</section>

<h2>我的持股</h2>
<div class="card"><div class="scroll"><table id="mine"></table></div></div>

<h2>全市場訊號</h2>
<div class="tabs" id="tabs"></div>
<div class="card"><div class="scroll"><table id="market"></table></div></div>

<p class="note" id="note"></p>

<script>
const STATUS = {
  "過熱": {act: "可先獲利了結一部分（例如 1/3）", desc: "離 MA20 太遠，且是主動ETF押最重的前幾名 —— 大家都買滿了"},
  "轉弱": {act: "可考慮減碼", desc: "剛跌破 MA20、MA20 未上揚，經理人開始減碼"},
  "跌深": {act: "先別急著賣，等反彈", desc: "已跌破 MA20 超過 10%，或經理人已連續賣多天 —— 容易反彈"},
  "回檔": {act: "續抱觀察", desc: "跌破 MA20，但 MA60 仍往上 —— 多頭裡的回檔"},
  "正常": {act: "續抱", desc: "沒有特別訊號"}
};
const ORDER = ["過熱", "轉弱", "跌深", "回檔", "正常"];
const MARKET_TABS = [
  {key: "過熱", label: "過熱（獲利了結）", f: s => s.status === "過熱"},
  {key: "轉弱", label: "轉弱（減碼）", f: s => s.status === "轉弱"},
  {key: "跌深", label: "跌深（別急著賣）", f: s => s.status === "跌深" && (s.holders > 0)},
  {key: "被動", label: "被動ETF納入／剔除", f: s => (s.added && s.added.length) || (s.removed && s.removed.length)},
  {key: "集中", label: "ETF持股集中", f: s => s.crowd_days != null && s.crowd_days >= (DATA.rules.CROWD_DAYS || 45)}
];
const STORE_KEY = "health_codes";
const fmt = (v, d = 2, sign = false) => v == null || isNaN(v) ? "—" : (sign && v > 0 ? "+" : "") + Number(v).toFixed(d);
const cls = v => v == null ? "mut" : v > 0 ? "pos" : v < 0 ? "neg" : "mut";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const short = c => String(c).replace(/\.TWO?$/, "");
let DATA = null, CUR = "過熱";

function store(get, val) {
  try { return get ? localStorage.getItem(STORE_KEY) : localStorage.setItem(STORE_KEY, val); } catch (e) { return null; }
}

function lookup(tok) {
  const s = DATA.stocks;
  for (const k of [tok + ".TW", tok + ".TWO", tok.toUpperCase()]) if (s[k]) return k;
  const byName = Object.keys(s).find(k => s[k].name === tok);
  return byName || null;
}

const HEAD = `<tr><th class="l">股票</th><th class="l">狀態</th><th class="l">理由</th><th>收盤</th><th>距MA20%</th><th>距MA60%</th>
  <th>近5日%</th><th class="hide-s">超配／權重排名</th><th class="hide-s">主動持有</th><th class="hide-s">被動持有</th>
  <th>經理人近2日(億)</th><th class="hide-s">ETF持股(天量)</th></tr>`;

function rowHTML(code) {
  const s = DATA.stocks[code];
  const st = STATUS[s.status] || STATUS["正常"];
  const ranks = (s.over_rank || s.w_rank) ? `${s.over_rank ?? "—"} / ${s.w_rank ?? "—"}` : "—";
  return `<tr>
    <td class="l">${esc(s.name)}<span class="code">${short(code)}${s.market === "上櫃" ? " 櫃" : ""}</span></td>
    <td class="l"><span class="badge b-${s.status}">${s.status}</span><span class="act">${st.act}</span></td>
    <td class="why">${s.reasons.length ? s.reasons.map(esc).join("<br>") : '<span class="mut">—</span>'}</td>
    <td class="num">${fmt(s.close, s.close >= 100 ? 1 : 2)}</td>
    <td class="num ${cls(s.d20)}">${fmt(s.d20, 1, true)}</td>
    <td class="num ${cls(s.d60)}">${fmt(s.d60, 1, true)}</td>
    <td class="num ${cls(s.ret5)}">${fmt(s.ret5, 1, true)}</td>
    <td class="num hide-s">${ranks}</td>
    <td class="num hide-s">${s.holders ? `${s.holders} / ${s.n_active}` : "—"}</td>
    <td class="num hide-s" title="${esc(s.passive_etfs)}">${s.passive_n || "—"}</td>
    <td class="num ${cls(s.mgr2)}">${fmt(s.mgr2, 2, true)}</td>
    <td class="num hide-s">${fmt(s.crowd_days, 1)}</td></tr>`;
}

function renderMine() {
  const raw = document.getElementById("codes").value;
  const toks = [...new Set(raw.split(/[\s,，、;；]+/).map(t => t.trim()).filter(Boolean))];
  const found = [], missing = [];
  toks.forEach(t => { const k = lookup(t); k ? found.push(k) : missing.push(t); });
  found.sort((a, b) => ORDER.indexOf(DATA.stocks[a].status) - ORDER.indexOf(DATA.stocks[b].status));
  document.getElementById("mine").innerHTML = HEAD + (found.length ? found.map(rowHTML).join("")
    : `<tr><td colspan="12" class="empty">在上面輸入持股代碼後按「檢查」</td></tr>`);
  document.getElementById("missing").textContent = missing.length
    ? `查不到：${missing.join("、")}（不在主動或被動ETF的持股裡，或代碼有誤）` : "";
  store(false, raw);
  document.getElementById("saved").textContent = toks.length ? `已記住 ${toks.length} 檔（只存在這個瀏覽器）` : "";
}

function renderTabs() {
  const s = Object.values(DATA.stocks);
  document.getElementById("tabs").innerHTML = MARKET_TABS.map(t =>
    `<button class="tab${t.key === CUR ? " on" : ""}" data-k="${t.key}">${t.label}<em>${s.filter(t.f).length}</em></button>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { CUR = b.dataset.k; renderTabs(); renderMarket(); });
}

function renderMarket() {
  const t = MARKET_TABS.find(x => x.key === CUR);
  let codes = Object.keys(DATA.stocks).filter(k => t.f(DATA.stocks[k]));
  const s = DATA.stocks;
  if (CUR === "過熱") codes.sort((a, b) => (s[b].d20 ?? 0) - (s[a].d20 ?? 0));
  else if (CUR === "轉弱") codes.sort((a, b) => (s[a].mgr2 ?? 0) - (s[b].mgr2 ?? 0));
  else if (CUR === "集中") codes.sort((a, b) => (s[b].crowd_days ?? 0) - (s[a].crowd_days ?? 0));
  else codes.sort((a, b) => (s[a].d20 ?? 0) - (s[b].d20 ?? 0));
  document.getElementById("market").innerHTML = HEAD + (codes.length ? codes.slice(0, 60).map(rowHTML).join("")
    : `<tr><td colspan="12" class="empty">${CUR === "被動" ? "還沒有被動ETF納入／剔除紀錄（從開始抓被動ETF持股後，要累積兩天以上才會出現）" : "目前沒有符合的股票"}</td></tr>`);
}

(async () => {
  try {
    const r = await fetch("data/health.json?t=" + Date.now(), {cache: "no-store"});
    DATA = r.ok ? await r.json() : null;
  } catch (e) { DATA = null; }
  document.getElementById("legend").innerHTML = ORDER.map(k =>
    `<div class="lg s-${k}"><b>${k}・${STATUS[k].act}</b><small>${STATUS[k].desc}</small></div>`).join("");
  if (!DATA) {
    document.getElementById("sub").textContent = "尚無健檢資料";
    document.getElementById("mine").innerHTML = `<tr><td class="empty">還沒有 health.json —— 晚上 ETF 排程跑完 health_export.py 後會自動推上來。</td></tr>`;
    return;
  }
  const c = DATA.counts || {};
  document.getElementById("sub").textContent =
    `收盤日 ${DATA.date} · ${Object.keys(DATA.stocks).length} 檔（主動 ${DATA.n_active} 檔＋被動 ${DATA.n_passive} 檔ETF持股）· 更新 ${DATA.generated_at.replace("T", " ")}`;
  const rl = DATA.rules || {};
  document.getElementById("note").innerHTML =
    `判斷規則：<b>過熱</b>＝距MA20 &gt; ${rl.OH_MA20}%，且主動ETF超配度或合成權重排名 ≤ ${rl.OH_RANK}；` +
    `<b>轉弱</b>＝剛跌破MA20（0～-5%）、MA20走平或往下、經理人開始減碼；` +
    `<b>跌深</b>＝距MA20 &lt; -${rl.DEEP_MA20}%，或經理人連續淨賣 ≥ ${rl.STREAK_DAYS} 天；` +
    `<b>回檔</b>＝跌破MA20但MA60往上。ETF持股(天量)＝主動＋被動ETF合計持股 ÷ 20日均量，越高代表資金流出時賣壓越大。<br>` +
    `規則來自 2026 年 7–10 月的回測，樣本有限、會隨行情改變。僅供參考，非投資建議。`;
  const saved = store(true);
  if (saved) document.getElementById("codes").value = saved;
  document.getElementById("go").onclick = renderMine;
  document.getElementById("clear").onclick = () => { document.getElementById("codes").value = ""; renderMine(); };
  const firstNonEmpty = MARKET_TABS.find(t => Object.values(DATA.stocks).some(t.f));
  if (firstNonEmpty) CUR = firstNonEmpty.key;
  renderMine(); renderTabs(); renderMarket();
})();
</script>
</body>
</html>
